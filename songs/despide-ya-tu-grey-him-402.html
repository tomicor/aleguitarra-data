<div style="text-align: left;">
<div>Despide ya tu grey</div>
<div>En paz y bendición;</div>
<div>Y las palabras de tu ley</div>
<div>Conserve el corazón.</div>
<div><br/></div>
<div>Semilla y sembrador</div>
<div>Que seas Tú a la vez;</div>
<div>Y con tu Espíritu de amor</div>
<div>Apaga nuestra sed.</div>
<div><br/></div>
<div>Enséñanos, Señor,</div>
<div>Tu ley a meditar;</div>
<div>Vivir unidos en amor,</div>
<div>Y en él por siempre andar.</div>
</div>
