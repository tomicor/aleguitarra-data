<div style="text-align: left;">
<div>Cristo amó a los niños, tanto Él los amó</div>
<div>que murió por ellos y así los salvó.</div>
<div><br/></div>
<div><b>Coro</b></div>
<div>Yo soy débil niño – esto sé, esto sé,</div>
<div>pero a Cristo amo, y me ama Él.</div>
<div><br/></div>
<div>Cristo me invita que le sirva acá,</div>
<div>a seguir sus paso Él me ayudará.</div>
<div><br/></div>
<div>Jesucristo amante, yo te ruego aquí</div>
<div>que me ayudes siempre a vivir por ti.</div>
</div>
