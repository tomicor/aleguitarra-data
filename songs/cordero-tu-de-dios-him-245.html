<div style="text-align: left;">
<div>Cordero, Tú, de Dios,</div>
<div>bebiendo Tú por nos</div>
<div>la copa amarga en triste cruz,</div>
<div>salvástenos.</div>
<div><br/></div>
<div>Confiamos en tu amor,</div>
<div>Jesús, el Salvador;</div>
<div>pues eres sacerdote fiel</div>
<div>y buen Pastor.</div>
<div><br/></div>
<div>Sólo eres Tú sostén,</div>
<div>y Tú nos guiarás</div>
<div>hasta la gloria, oh Salvador,</div>
<div>a ver tu faz.</div>
</div>
