<div style="text-align: left;">
<div>Tú que justo me haces,</div>
<div>que llevas mis cargas</div>
<div>y permaneces fiel.</div>
<div><br/></div>
<div>Tú que cubres mi vida</div>
<div>de amor y justicia,</div>
<div>oh, Cordero fiel.</div>
<div><br/></div>
<div><b>Coro</b></div>
<div>Tú, Cordero de Dios,</div>
<div>llevaste en ti todo mi dolor.</div>
<div>Tú rasgaste al morir</div>
<div>el velo que ayer</div>
<div>me separó de ti.</div>
</div>
