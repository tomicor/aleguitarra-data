<div style="text-align: left;">
<div>La obra de Jesús</div>
<div>Revela santo amor;</div>
<div>Y da justicia, paz y luz</div>
<div>Al triste pecador.</div>
<div><br/></div>
<div>Jesús ya terminó</div>
<div>La grande redención;</div>
<div>Con tierno amor Él derramó</div>
<div>Su gracia y su perdón.</div>
<div><br/></div>
<div>Teniendo en él salud,</div>
<div>Benditos somos ya,</div>
<div>Ansiando con solicitud</div>
<div>El cielo do él está.</div>
</div>
