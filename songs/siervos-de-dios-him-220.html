<div style="text-align: left;">
<div>Siervos de Dios ¡mirad!</div>
<div>La mies ya blanca está,</div>
<div>la siega espera actividad,</div>
<div>o el tiempo pasará.</div>
<div><br/></div>
<div>Siervos de Dios ¡obrad!</div>
<div>El Dueño de la mies</div>
<div>dispénsanos tal potestad</div>
<div>que sin medida es.</div>
<div><br/></div>
<div>Siervos de Dios ¡orad!</div>
<div>Hay mucho aún que hacer;</div>
<div>Las buenas nuevas anunciad</div>
<div>a todos por doquier.</div>
</div>
